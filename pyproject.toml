[tool.ruff]

target-version = "py314"

line-length = 88

indent-width = 4

src = ["app", "tests"]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "auto"

docstring-code-format = true

[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]